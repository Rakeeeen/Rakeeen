  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0A" />
  <script>
    // Before anything paints: the visitor's own choice, else the system's theme.
    try {
      var saved = localStorage.getItem('visitor_settings');
      var theme = saved ? JSON.parse(saved).theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.classList.add('dark');
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <style>html{background:#D6D6D6}html.dark{background:#0A0A0A;color-scheme:dark}</style>
