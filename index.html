<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" id="favicon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700,800,900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&display=swap">
  <title>Rakeeen — UX Designer</title>
</head>

<body>
  <script>
    try {
      const local = localStorage.getItem('visitor_settings');
      let theme = null;
      if (local) {
        theme = JSON.parse(local).theme;
      } else {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if (theme) document.body.classList.add(theme);
    } catch(e) {}
  </script>
  <div id="root"></div>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
